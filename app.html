<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Facilitator · Synthesis Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Kalam:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="css/style.css">
  <script src="config.js"></script>
  <script src="lib/supabase.min.js"></script>
  <script src="lib/xlsx.full.min.js"></script>
  <script src="lib/qrcode.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="logo"><i></i><i></i><i></i></span> Synthesis Wall</a>
      <span class="ws-title" id="ws-title"></span>
      <span class="grow"></span>
      <span class="pill" id="pill-data" title="Where data is stored"><span class="dot"></span><span>…</span></span>
      <label class="switch" title="Switch AI writing on or off"><input type="checkbox" id="ai-toggle"><span class="track"></span> AI</label>
    </header>
    <nav class="side" id="side" aria-label="Main"></nav>
    <main class="main" id="main"></main>
  </div>
  <aside class="drawer" id="drawer" aria-label="Note details"></aside>
  <div class="toast-box" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
